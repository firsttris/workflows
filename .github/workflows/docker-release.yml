name: Docker release

# Reusable: builds and pushes a multi-arch image, updates the Docker Hub description and, for a
# version tag, creates the GitHub release. The caller decides when it runs (tag push, by hand) and
# runs its own CI first. On a tag vX.Y.Z: :x.y.z, :x.y, :latest, then the GitHub release. Anywhere
# else (e.g. run by hand on the default branch): :edge, no release.
on:
  workflow_call:
    inputs:
      image:
        description: Docker Hub image, e.g. tristanteu/namarr
        type: string
        required: true
      description:
        description: Docker Hub short description (max. 100 characters); empty keeps the current one
        type: string
        default: ""
      dockerfile:
        type: string
        default: docker/Dockerfile
      context:
        type: string
        default: .
      platforms:
        type: string
        default: linux/amd64,linux/arm64
      ghcr:
        description: Also push to ghcr.io/<owner>/<repo>
        type: boolean
        default: false
      version-file:
        description: File whose version must match the tag (package.json or Cargo.toml); empty skips the check
        type: string
        default: package.json
      readme:
        description: README for the Docker Hub description, relative links made absolute; empty skips it
        type: string
        default: README.md
      release-artifact:
        description: Name of an artifact uploaded earlier in the calling run; its files are attached to the GitHub release
        type: string
        default: ""
      dockerhub-user:
        type: string
        default: tristanteu
    secrets:
      DOCKER_PAT:
        description: Docker Hub access token for dockerhub-user
        required: true
    outputs:
      version:
        description: The published version (x.y.z), empty for edge
        value: ${{ jobs.image.outputs.version }}

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - id: version
        name: Version
        env:
          VERSION_FILE: ${{ inputs.version-file }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != refs/tags/v* ]]; then
            echo "version=" >> "$GITHUB_OUTPUT"
            echo "Not a version tag: publishing :edge" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          version="${GITHUB_REF_NAME#v}"
          if [[ -n "$VERSION_FILE" ]]; then
            case "$VERSION_FILE" in
              *.json) declared=$(jq -r .version "$VERSION_FILE") ;;
              *.toml) declared=$(grep -m1 -E '^version *= *"' "$VERSION_FILE" | cut -d'"' -f2) ;;
              *) echo "::error::Unknown version file: $VERSION_FILE"; exit 1 ;;
            esac
            if [[ "$declared" != "$version" ]]; then
              echo "::error::Tag $GITHUB_REF_NAME does not match version $declared in $VERSION_FILE"
              exit 1
            fi
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Publishing $version" >> "$GITHUB_STEP_SUMMARY"

      - id: images
        name: Image names
        env:
          IMAGE: ${{ inputs.image }}
          GHCR: ${{ inputs.ghcr }}
        run: |
          {
            echo "list<<EOF"
            echo "$IMAGE"
            if [[ "$GHCR" == "true" ]]; then echo "ghcr.io/${GITHUB_REPOSITORY,,}"; fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ inputs.dockerhub-user }}
          password: ${{ secrets.DOCKER_PAT }}
      - name: Log in to GHCR
        if: inputs.ghcr
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.images.outputs.list }}
          tags: |
            type=semver,pattern={{version}},value=${{ steps.version.outputs.version }},enable=${{ steps.version.outputs.version != '' }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.version.outputs.version }},enable=${{ steps.version.outputs.version != '' }}
            type=raw,value=latest,enable=${{ steps.version.outputs.version != '' }}
            type=raw,value=edge,enable=${{ steps.version.outputs.version == '' }}

      - uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          platforms: ${{ inputs.platforms }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: README for Docker Hub
        if: inputs.readme != ''
        env:
          README: ${{ inputs.readme }}
          BRANCH: ${{ github.event.repository.default_branch }}
        shell: python
        run: |
          # Relative links and images only work on GitHub: images point to the raw file, links to
          # the GitHub page. Absolute URLs, anchors and mailto stay as they are.
          import os, re
          repo, branch = os.environ["GITHUB_REPOSITORY"], os.environ["BRANCH"] or "main"
          raw = f"https://raw.githubusercontent.com/{repo}/{branch}/"
          blob = f"https://github.com/{repo}/blob/{branch}/"
          keep = re.compile(r"^(?:[a-z][a-z0-9+.-]*:|#|//)", re.I)
          def fix(url, base):
              return url if keep.match(url) else base + re.sub(r"^(\./|/)+", "", url)
          text = open(os.environ["README"], encoding="utf-8").read()
          text = re.sub(r"(!\[[^\]]*\]\()([^)\s]+)", lambda m: m[1] + fix(m[2], raw), text)
          text = re.sub(r"((?:src|srcset)=\")([^\"]+)", lambda m: m[1] + fix(m[2], raw), text)
          text = re.sub(r"(href=\")([^\"]+)", lambda m: m[1] + fix(m[2], blob), text)
          text = re.sub(r"(\]\()([^)\s]+)", lambda m: m[1] + fix(m[2], blob), text)
          open("dockerhub-readme.md", "w", encoding="utf-8").write(text)
      - name: Update Docker Hub description
        if: inputs.readme != ''
        uses: peter-evans/dockerhub-description@v5
        with:
          username: ${{ inputs.dockerhub-user }}
          password: ${{ secrets.DOCKER_PAT }}
          repository: ${{ inputs.image }}
          short-description: ${{ inputs.description }}
          readme-filepath: ./dockerhub-readme.md

  github-release:
    needs: image
    if: needs.image.outputs.version != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Release files
        if: inputs.release-artifact != ''
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.release-artifact }}
          path: release-files
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE: ${{ inputs.image }}
          VERSION: ${{ needs.image.outputs.version }}
        run: |
          set -euo pipefail
          files=()
          if [[ -d release-files ]]; then mapfile -t files < <(find release-files -type f); fi
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            # Created by hand on GitHub before the tag was pushed: only add the files.
            if (( ${#files[@]} )); then gh release upload "$GITHUB_REF_NAME" "${files[@]}" --repo "$GITHUB_REPOSITORY" --clobber; fi
            exit 0
          fi
          gh release create "$GITHUB_REF_NAME" "${files[@]}" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "$GITHUB_REF_NAME" --generate-notes --notes "Docker: \`$IMAGE:$VERSION\` (also \`:latest\`)"
