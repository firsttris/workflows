name: Docker release

# Reusable: builds a multi-arch image, pushes it, updates the Docker Hub description and, for a
# version tag, creates the GitHub release. The caller decides when it runs (tag push, by hand) and
# runs its own CI first. On a tag vX.Y.Z: :x.y.z, :x.y, :latest, then the GitHub release. On a
# pre-release tag vX.Y.Z-rc.N: :x.y.z-rc.N and :next, a GitHub pre-release, and the Docker Hub
# description stays that of the last release. Anywhere else (e.g. run by hand on the default
# branch): :edge, no release.
#
# Every platform builds in its own job, arm64 on GitHub's native ARM runner (free for public
# repositories, much faster than QEMU, which matters for compiled languages like Rust). A merge job
# then joins the per-platform images into one multi-arch tag.
#
# The build cache lives in the registry (ghcr.io/<owner>/<repo>-buildcache:<platform>), not in the
# Actions cache: an Actions cache written on tag v1.2.3 can't be read on tag v1.2.4 (only caches of
# the same ref or the default branch are), so every release built from scratch. A registry cache is
# the same for every ref and the CI's own image check can share it; the export only uploads the
# layers that changed.
on:
  workflow_call:
    inputs:
      image:
        description: Docker Hub image, e.g. tristanteu/namarr
        type: string
        required: true
      description:
        description: Docker Hub short description (max. 100 characters); empty keeps the current one
        type: string
        default: ""
      dockerfile:
        type: string
        default: docker/Dockerfile
      context:
        type: string
        default: .
      platforms:
        description: Comma-separated, e.g. linux/amd64,linux/arm64,linux/arm/v7
        type: string
        default: linux/amd64,linux/arm64
      native-runners:
        description: Build arm64 on GitHub's ARM runner instead of QEMU; set false where those runners are not available (private repositories without them)
        type: boolean
        default: true
      ghcr:
        description: Also push to ghcr.io/<owner>/<repo>
        type: boolean
        default: false
      cache:
        description: Keep the build cache in ghcr.io/<owner>/<repo>-buildcache (needs packages write)
        type: boolean
        default: true
      version-file:
        description: File whose version must match the tag (package.json or Cargo.toml); empty skips the check
        type: string
        default: package.json
      readme:
        description: README for the Docker Hub description, relative links made absolute; empty skips it
        type: string
        default: README.md
      release-artifact:
        description: Name of an artifact uploaded earlier in the calling run; its files are attached to the GitHub release
        type: string
        default: ""
      dockerhub-user:
        type: string
        default: tristanteu
    secrets:
      DOCKER_PAT:
        description: Docker Hub access token for dockerhub-user
        required: true
    outputs:
      version:
        description: The published version (x.y.z or x.y.z-rc.N), empty for edge
        value: ${{ jobs.prepare.outputs.version }}
      prerelease:
        description: "'true' for a pre-release (a version with a -, e.g. 1.2.0-rc.1)"
        value: ${{ jobs.prepare.outputs.prerelease }}

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      matrix: ${{ steps.plan.outputs.matrix }}
      names: ${{ steps.plan.outputs.names }}
      cache: ${{ steps.plan.outputs.cache }}
    steps:
      - uses: actions/checkout@v4

      - id: version
        name: Version
        env:
          VERSION_FILE: ${{ inputs.version-file }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != refs/tags/v* ]]; then
            echo "version=" >> "$GITHUB_OUTPUT"
            echo "Not a version tag: publishing :edge" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          version="${GITHUB_REF_NAME#v}"
          if [[ -n "$VERSION_FILE" ]]; then
            case "$VERSION_FILE" in
              *.json) declared=$(jq -r .version "$VERSION_FILE") ;;
              *.toml) declared=$(grep -m1 -E '^version *= *"' "$VERSION_FILE" | cut -d'"' -f2) ;;
              *) echo "::error::Unknown version file: $VERSION_FILE"; exit 1 ;;
            esac
            if [[ "$declared" != "$version" ]]; then
              echo "::error::Tag $GITHUB_REF_NAME does not match version $declared in $VERSION_FILE"
              exit 1
            fi
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # 1.2.0-rc.1 is a pre-release: :next instead of :x.y and :latest
          if [[ "$version" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
            echo "Publishing pre-release $version as :next" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
            echo "Publishing $version" >> "$GITHUB_STEP_SUMMARY"
          fi

      - id: plan
        name: Platforms and image names
        env:
          PLATFORMS: ${{ inputs.platforms }}
          NATIVE: ${{ inputs.native-runners }}
          IMAGE: ${{ inputs.image }}
          GHCR: ${{ inputs.ghcr }}
        shell: python
        run: |
          import json, os
          native = os.environ["NATIVE"] == "true"
          matrix = []
          for platform in [p.strip() for p in os.environ["PLATFORMS"].split(",") if p.strip()]:
              arm64 = platform == "linux/arm64"
              matrix.append({
                  "platform": platform,
                  "pair": platform.replace("/", "-"),
                  # arm64 runs natively on the ARM runner, amd64 natively anyway, the rest under QEMU
                  "runner": "ubuntu-24.04-arm" if arm64 and native else "ubuntu-latest",
                  "qemu": platform != "linux/amd64" and not (arm64 and native),
              })
          names = [os.environ["IMAGE"]]
          if os.environ["GHCR"] == "true":
              names.append("ghcr.io/" + os.environ["GITHUB_REPOSITORY"].lower())
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"matrix={json.dumps({'include': matrix})}\n")
              out.write(f"names={','.join(names)}\n")
              out.write(f"cache=ghcr.io/{os.environ['GITHUB_REPOSITORY'].lower()}-buildcache\n")

  build:
    name: Build ${{ matrix.platform }}
    needs: prepare
    strategy:
      fail-fast: true
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - if: matrix.qemu
        uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ inputs.dockerhub-user }}
          password: ${{ secrets.DOCKER_PAT }}
      - name: Log in to GHCR
        if: inputs.ghcr || inputs.cache
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ needs.prepare.outputs.names }}
      # The registry cache, and the Actions cache of the default branch as before (the CI's image
      # check of older callers writes there). A cache that can't be written doesn't fail the build.
      - id: cache
        env:
          CACHE: ${{ inputs.cache && format('{0}:{1}', needs.prepare.outputs.cache, matrix.pair) || '' }}
          PAIR: ${{ matrix.pair }}
        run: |
          {
            echo "from<<EOF"
            if [[ -n "$CACHE" ]]; then echo "type=registry,ref=$CACHE"; fi
            echo "type=gha,scope=$PAIR"
            echo "EOF"
            if [[ -n "$CACHE" ]]; then
              echo "to=type=registry,ref=$CACHE,mode=max,ignore-error=true"
            else
              echo "to=type=gha,mode=max,scope=$PAIR,ignore-error=true"
            fi
          } >> "$GITHUB_OUTPUT"

      # Pushed by digest only; the merge job puts the tags on the multi-arch list.
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,"name=${{ needs.prepare.outputs.names }}",push-by-digest=true,name-canonical=true,push=true
          cache-from: ${{ steps.cache.outputs.from }}
          cache-to: ${{ steps.cache.outputs.to }}
      - name: Export digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"
      - uses: actions/upload-artifact@v4
        with:
          name: docker-digest-${{ matrix.pair }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Publish multi-arch image
    needs: [prepare, build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: docker-digest-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@v3
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ inputs.dockerhub-user }}
          password: ${{ secrets.DOCKER_PAT }}
      - name: Log in to GHCR
        if: inputs.ghcr
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ needs.prepare.outputs.names }}
          tags: |
            type=semver,pattern={{version}},value=${{ needs.prepare.outputs.version }},enable=${{ needs.prepare.outputs.version != '' }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.prepare.outputs.version }},enable=${{ needs.prepare.outputs.prerelease == 'false' }}
            type=raw,value=latest,enable=${{ needs.prepare.outputs.prerelease == 'false' }}
            type=raw,value=next,enable=${{ needs.prepare.outputs.prerelease == 'true' }}
            type=raw,value=edge,enable=${{ needs.prepare.outputs.version == '' }}
      - name: Create the multi-arch tags
        working-directory: ${{ runner.temp }}/digests
        env:
          IMAGE: ${{ inputs.image }}
        run: |
          # shellcheck disable=SC2046,SC2059 # one -t per tag, one source per digest
          docker buildx imagetools create $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf "$IMAGE@sha256:%s " *)
      - name: Inspect
        env:
          IMAGE: ${{ inputs.image }}
          TAG: ${{ steps.meta.outputs.version }}
        run: docker buildx imagetools inspect "$IMAGE:$TAG"

      # A pre-release keeps the description of the last release
      - uses: actions/checkout@v4
        if: inputs.readme != '' && needs.prepare.outputs.prerelease != 'true'
      - name: README for Docker Hub
        if: inputs.readme != '' && needs.prepare.outputs.prerelease != 'true'
        env:
          README: ${{ inputs.readme }}
          BRANCH: ${{ github.event.repository.default_branch }}
        shell: python
        run: |
          # Relative links and images only work on GitHub: images point to the raw file, links to
          # the GitHub page. Absolute URLs, anchors and mailto stay as they are.
          import os, re
          repo, branch = os.environ["GITHUB_REPOSITORY"], os.environ["BRANCH"] or "main"
          raw = f"https://raw.githubusercontent.com/{repo}/{branch}/"
          blob = f"https://github.com/{repo}/blob/{branch}/"
          keep = re.compile(r"^(?:[a-z][a-z0-9+.-]*:|#|//)", re.I)
          def fix(url, base):
              return url if keep.match(url) else base + re.sub(r"^(\./|/)+", "", url)
          text = open(os.environ["README"], encoding="utf-8").read()
          text = re.sub(r"(!\[[^\]]*\]\()([^)\s]+)", lambda m: m[1] + fix(m[2], raw), text)
          text = re.sub(r"((?:src|srcset)=\")([^\"]+)", lambda m: m[1] + fix(m[2], raw), text)
          text = re.sub(r"(href=\")([^\"]+)", lambda m: m[1] + fix(m[2], blob), text)
          text = re.sub(r"(\]\()([^)\s]+)", lambda m: m[1] + fix(m[2], blob), text)
          open("dockerhub-readme.md", "w", encoding="utf-8").write(text)
      - name: Update Docker Hub description
        if: inputs.readme != '' && needs.prepare.outputs.prerelease != 'true'
        uses: peter-evans/dockerhub-description@v5
        with:
          username: ${{ inputs.dockerhub-user }}
          password: ${{ secrets.DOCKER_PAT }}
          repository: ${{ inputs.image }}
          short-description: ${{ inputs.description }}
          readme-filepath: ./dockerhub-readme.md

  github-release:
    needs: [prepare, merge]
    if: needs.prepare.outputs.version != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Release files
        if: inputs.release-artifact != ''
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.release-artifact }}
          path: release-files
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE: ${{ inputs.image }}
          VERSION: ${{ needs.prepare.outputs.version }}
          PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
        run: |
          set -euo pipefail
          files=()
          if [[ -d release-files ]]; then mapfile -t files < <(find release-files -type f); fi
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            # Created by hand on GitHub before the tag was pushed: only add the files.
            if (( ${#files[@]} )); then gh release upload "$GITHUB_REF_NAME" "${files[@]}" --repo "$GITHUB_REPOSITORY" --clobber; fi
            exit 0
          fi
          flags=() also=latest
          # A pre-release does not become the repository's latest release
          if [[ "$PRERELEASE" == true ]]; then
            flags+=(--prerelease) also=next
          else
            # Notes since the last release, not since its release candidates
            previous=$(gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/v" --paginate --jq '.[].ref | ltrimstr("refs/tags/")' \
              | { grep -E "^v[0-9]+\.[0-9]+\.[0-9]+$" || true; } | sort -V | awk -v cur="$GITHUB_REF_NAME" '$0 == cur {print prev; exit} {prev = $0}')
            if [[ -n "$previous" ]]; then flags+=(--notes-start-tag "$previous"); fi
          fi
          gh release create "$GITHUB_REF_NAME" "${files[@]}" "${flags[@]}" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "$GITHUB_REF_NAME" --generate-notes --notes "Docker: \`$IMAGE:$VERSION\` (also \`:$also\`)"
