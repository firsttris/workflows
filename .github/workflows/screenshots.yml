name: Screenshots

# Reusable: takes the project's screenshots in the official Playwright image and commits the ones
# that changed to the branch it runs on. The image matches the @playwright/test version from the
# lockfile, so the browser and its fonts are the same on every run and an unchanged page gives an
# unchanged picture.
#
# The caller is started by hand (workflow_dispatch) after a change to the look. A commit pushed
# with the GITHUB_TOKEN starts no other workflow, so the pictures don't run the checks again.
on:
  workflow_call:
    inputs:
      command:
        description: Takes the screenshots, e.g. npm run screenshots
        type: string
        required: true
      install:
        description: Installs the dependencies
        type: string
        default: npm ci
      bun:
        description: Install Bun first (for bun install / bun run)
        type: boolean
        default: false
      bun-version:
        description: Bun version or range for npm, e.g. 1.4.x
        type: string
        default: latest
      lockfile:
        description: package-lock.json, bun.lock or pnpm-lock.yaml with the @playwright/test version
        type: string
        default: package-lock.json
      paths:
        description: What is committed, one path or glob per line
        type: string
        default: docs
      commit-message:
        type: string
        default: Update screenshots
      postgres:
        description: Postgres image (e.g. postgres:16) for a database next to the job; empty starts none
        type: string
        default: ""
      postgres-db:
        description: Name of that database
        type: string
        default: screenshots

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.version.outputs.image }}
    steps:
      - id: version
        uses: firsttris/workflows/actions/playwright-image@v1
        with:
          lockfile: ${{ inputs.lockfile }}

  screenshots:
    needs: image
    runs-on: ubuntu-latest
    container:
      image: ${{ needs.image.outputs.image }}
      options: --ipc=host
    # A service with an empty image is not started
    services:
      postgres:
        image: ${{ inputs.postgres }}
        env:
          POSTGRES_USER: screenshots
          POSTGRES_PASSWORD: screenshots
          POSTGRES_DB: ${{ inputs.postgres-db }}
        options: >-
          --health-cmd "pg_isready -U screenshots"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    # Two runs at once would push on top of each other
    concurrency:
      group: screenshots-${{ github.repository }}-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # The npm package brings the binary without curl or unzip, which the image lacks
      - name: Bun
        if: inputs.bun
        run: npm install --global "bun@$BUN_VERSION"
        env:
          BUN_VERSION: ${{ inputs.bun-version }}

      - name: Install
        run: ${{ inputs.install }}

      - name: Take the screenshots
        run: ${{ inputs.command }}
        env:
          # The database of the input postgres, reachable from the job's container by its service name
          POSTGRES_URL: ${{ inputs.postgres != '' && format('postgres://screenshots:screenshots@postgres:5432/{0}', inputs.postgres-db) || '' }}

      - uses: firsttris/workflows/actions/commit-changes@v1
        with:
          paths: ${{ inputs.paths }}
          message: ${{ inputs.commit-message }}
