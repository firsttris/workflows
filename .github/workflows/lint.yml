name: Lint

# Only the workflows are linted (and the apt-install action tried), so only a change to them runs it.
on:
  push:
    paths:
      - ".github/workflows/**"
      - "actions/**"
  pull_request:
    paths:
      - ".github/workflows/**"
      - "actions/**"

jobs:
  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: actionlint
        env:
          ACTIONLINT_VERSION: 1.7.7
        run: |
          bash <(curl -fsSL "https://raw.githubusercontent.com/rhysd/actionlint/v${ACTIONLINT_VERSION}/scripts/download-actionlint.bash") "$ACTIONLINT_VERSION"
          ./actionlint -color

  # The apt-install action itself: a first install fills the cache, a second job takes it from there
  apt-install:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      image: ${{ steps.image.outputs.image }}
    steps:
      - id: image
        run: echo "image=$ImageVersion" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
      - id: first
        uses: ./actions/apt-install
        with:
          packages: cowsay sl
      - run: /usr/games/cowsay "first install, cache hit ${{ steps.first.outputs.cache-hit }}"

  apt-install-cached:
    needs: apt-install
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - id: second
        uses: ./actions/apt-install
        with:
          packages: sl cowsay
      # The cache key holds the runner image; while GitHub rolls out a new image the two jobs can land
      # on different ones, and then there is no cache to hit
      - env:
          HIT: ${{ steps.second.outputs.cache-hit }}
          FIRST_IMAGE: ${{ needs.apt-install.outputs.image }}
        run: |
          /usr/games/cowsay "second install, cache hit $HIT"
          if [[ "$ImageVersion" != "$FIRST_IMAGE" ]]; then
            echo "::notice::Runner image $ImageVersion, first job had $FIRST_IMAGE: different cache keys, the hit is not checked"
            exit 0
          fi
          test "$HIT" = true
