name: Docker build
description: >-
  Builds the project's image for the CI's image check and loads it into the local Docker, with the
  same build cache as docker-release.yml (ghcr.io/<owner>/<repo>-buildcache:linux-amd64): what the
  check compiled, the release reuses, and the other way round. Pushes nothing but the cache; a cache
  that can't be read or written (no packages write, a fork) only makes the build slower.
  The job needs packages: write to keep the cache.

inputs:
  dockerfile:
    default: docker/Dockerfile
  context:
    default: .
  tags:
    description: Local tag(s) of the image, e.g. windfenster:ci
    required: true
  platform:
    default: linux/amd64

outputs:
  imageid:
    value: ${{ steps.build.outputs.imageid }}

runs:
  using: composite
  steps:
    - uses: docker/setup-buildx-action@v3
    - uses: docker/login-action@v3
      continue-on-error: true
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ github.token }}
    - id: cache
      shell: bash
      env:
        PLATFORM: ${{ inputs.platform }}
      run: |
        repo=$(tr '[:upper:]' '[:lower:]' <<< "$GITHUB_REPOSITORY")
        pair=${PLATFORM//\//-}
        echo "ref=ghcr.io/$repo-buildcache:$pair" >> "$GITHUB_OUTPUT"
        echo "pair=$pair" >> "$GITHUB_OUTPUT"
    - id: build
      uses: docker/build-push-action@v6
      with:
        context: ${{ inputs.context }}
        file: ${{ inputs.dockerfile }}
        platforms: ${{ inputs.platform }}
        push: false
        load: true
        tags: ${{ inputs.tags }}
        cache-from: |
          type=registry,ref=${{ steps.cache.outputs.ref }}
          type=gha,scope=${{ steps.cache.outputs.pair }}
        cache-to: type=registry,ref=${{ steps.cache.outputs.ref }},mode=max,ignore-error=true
